name: ci

on:
  push:
    branches: [main]
  pull_request:

# The gate steps live in .github/actions/, so release.yml runs the same ones rather than a
# re-typed copy. Job names are the contract: main's ruleset requires `test` and `shell`.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: ./.github/actions/node-gates

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # audit-authors.sh walks the whole history, not just the pushed range.
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/shell-gates
        with:
          extra-fingerprints: ${{ secrets.AUDIT_EXTRA_FINGERPRINTS }}

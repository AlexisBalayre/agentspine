# The CI half of the /pr-ci-review pipeline (.agents/skills/pr-ci-review), emitted by agentspine's
# ci-review pack: a deterministic preflight resolves the head/mode, the model reviews and emits a
# structured record, and a poster renders that record to the PR (the model itself has no write
# channel). Each run's record is appended to the `ci/review-metrics` orphan branch for the
# /review-retro skill to mine. The deterministic steps are `agentspine review <step>`, installed
# at the version that scaffolded this file; this repository needs no Node toolchain of its own.
#
# Claude Code only: the review runs through anthropics/claude-code-action.
#
# Setup for your repo:
#   1. Add the `CLAUDE_CODE_OAUTH_TOKEN` secret (see the claude-code-action docs).
#   2. Create the orphan branch once:
#        git checkout --orphan ci/review-metrics && git rm -rf . \
#          && git commit --allow-empty -m "review-metrics: init" && git push origin ci/review-metrics
name: Claude Code Review

on:
  pull_request:
    # synchronize: without it, any push after the review merges unreviewed code
    # unless a human remembers `@claude review`. The preflight resolves pushes
    # to an incremental review of the delta, and its same-SHA dedupe plus the
    # queue below bound how many runs a push burst costs.
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

env:
  NODE_VERSION: "22"
  # The review tooling ships inside agentspine, pinned because this workflow, the pr-ci-review
  # skill and the poster share a contract. Re-running agentspine with --packs ci-review updates
  # the skill but never rewrites this file, so delete it (and commit that) first to move all three.
  AGENTSPINE_VERSION: "__AGENTSPINE_VERSION__"
  # Config the model executes at startup, restored from the base branch below so a PR cannot
  # rewrite the reviewer that reviews it. Add any path the shared tree resolves through: if
  # `.agents/skills` is a symlink into another directory, that directory belongs here too,
  # because restoring the link does not restore what it points at.
  RESTORE_PATHS: "AGENTS.md .agents"

jobs:
  claude-review:
    # Only the repository's owner, members of the organisation that owns it, and invited
    # collaborators trigger a run, since a run carries the review token and the model reads
    # whatever the diff says. `author_association` does not carry a permission level: a read-only
    # collaborator passes. On pull_request the actor must also be the author, because a push by
    # anyone else to that branch fires `synchronize` and the author check alone would pass it.
    # To review someone else's PR, comment `@claude review` on it.
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
        github.actor == github.event.pull_request.user.login) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # Generous headroom: a run cancelled at the timeout is a fully billed review
    # discarded for want of a few minutes.
    timeout-minutes: 40
    # Queue, never cancel: with cancel-in-progress a second trigger discards a
    # fully billed in-flight review, and without `synchronize` as a trigger a PR
    # can merge green having never been reviewed. GitHub keeps one pending run
    # per group: the running review always completes and posts, and a push burst
    # collapses to a single queued follow-up on whatever the head is by then.
    # Job-level, not workflow-level: a comment without "@claude review" is
    # skipped by the `if` above before it can enter this group; workflow-level
    # concurrency is acquired before the `if`, which makes every review's own
    # summary comment queue a phantom run.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
    # Read-only, by design. The poster below holds the write permissions, in its own job, so a
    # review that is talked into writing to the PR has no token that could. The token contains
    # what reaches GitHub; what the model can run on the runner is held by the permission lock
    # and the sandbox below.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      skip: ${{ (steps.pr-head.outputs.skip == 'true' || steps.preflight.outputs.skip == 'true') && 'true' || 'false' }}
      sha: ${{ steps.preflight.outputs.sha }}
      merge_base: ${{ steps.preflight.outputs.merge_base }}
      outcome: ${{ steps.claude-review.outcome }}
      partial: ${{ steps.preflight.outputs.partial }}
    env:
      # Strips credentials, recognised by variable name or by the shape of the value, from the
      # shell the model drives: `gh --jq '$ENV.X'` prints any variable, and the record it could
      # land in is posted to the PR. The scrub leaves GH_TOKEN for gh by design; here it is this
      # job's read-only token, which expires when the job ends, before the poster job publishes
      # anything. Job-level because that is where the action reads it from.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"

    steps:
      # Full history, not depth-1: `gh pr diff` rejects a path filter, so a scoped
      # slice needs a merge base (`git diff <merge-base>..HEAD -- <path>`). Shallow,
      # that cannot resolve and reviewers fall back to `git diff HEAD~1 HEAD`, which
      # silently reviews only the last commit of a multi-commit PR.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Toolchain ahead of the PR-head checkout: the metrics step runs on
      # `always()` but still needs the tooling, so a failure before the install
      # would take the record down with it (a review that died at checkout would
      # leave no artifact at all, invisible to the retro's mining).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # --ignore-scripts: the install runs with this job's token in the environment.
      - name: Install review tooling
        run: npm install --global --ignore-scripts "agentspine@${AGENTSPINE_VERSION}"

      # Land on the PR head, not the default refs/pull/N/merge ref that the
      # pull_request checkout leaves behind. Reviewers, inline-comment line
      # numbers, and `gh pr diff` are all head-vs-base; a merge ref can lag the
      # head, yielding findings that are false on the real head plus a surface
      # the head added that nobody reviewed, and it shifts line numbers so
      # inline comments fail to anchor.
      # A PR can merge, auto-deleting its branch, between the trigger and this
      # checkout; that race would red-fail the run over a review nobody needs.
      # Only an open PR turns a checkout failure into a real error; otherwise
      # the `skip` output short-circuits the rest of the job.
      - name: Checkout PR head
        id: pr-head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if ! gh pr checkout "$PR_NUMBER"; then
            state=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$state" = "OPEN" ]; then
              echo "::error::gh pr checkout failed for open PR #$PR_NUMBER"
              exit 1
            fi
            echo "::notice::PR #$PR_NUMBER is $state; nothing left to review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Deterministic preflight: head freshness, tree cleanliness, the merge
      # base, and the full/incremental mode decision, all run as a plain step so
      # a failure is a red step the poster turns into a "not reviewed" verdict,
      # never a model stalled at a permission prompt. It also skips the run when
      # the head SHA already has a non-errored, complete record (a synchronize
      # retrigger with nothing new), except on an explicit `@claude review`,
      # whose words it parses into the depth and areas the model is handed.
      # The merge base is resolved here, while the checkout is still complete:
      # claude-code-action restores the PR's config paths from the base branch
      # with a `--depth=1` fetch, which grafts `origin/<base>` parentless. From
      # that point `git diff origin/main...HEAD` dies with "fatal: no merge base"
      # whenever main has moved past the PR, so reviewers are handed the
      # base-side SHA and two-dot from it instead.
      - name: Review preflight
        if: steps.pr-head.outputs.skip != 'true'
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_TRIGGER: ${{ github.event_name == 'issue_comment' && 'comment' || github.event.action }}
          # Through env, never inline in a script: the comment is free text.
          REVIEW_COMMENT: ${{ github.event.comment.body }}
        run: agentspine review preflight

      - name: Generate review schema
        if: steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        id: gen-schema
        run: |
          schema=$(agentspine review schema)
          # Escape single quotes so the schema embeds safely in the single-quoted
          # --json-schema token below, whatever its descriptions contain.
          schema=${schema//\'/\'\\\'\'}
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

      # claude-code-action restores CLAUDE.md, .claude/ and .mcp.json itself, but not AGENTS.md
      # (which CLAUDE.md imports) and not .agents/, where agentspine keeps what .claude/ only
      # links to: the skills and reviewer agents this review runs, and the hook adapters
      # .claude/settings.json executes. Left alone, a PR could rewrite its own reviewer. Apply
      # the action's treatment to every RESTORE_PATHS entry: snapshot the head's copy for
      # reviewers under .claude-pr/, then take the merge base's.
      - name: Restore startup config from base
        if: steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        env:
          MERGE_BASE: ${{ steps.preflight.outputs.merge_base }}
        run: |
          mkdir -p .claude-pr
          for path in ${RESTORE_PATHS}; do
            if [ -e "$path" ]; then cp -R "$path" ".claude-pr/$path"; fi
            # Removed first: checking out the base's copy alone would keep files the PR added.
            rm -rf "$path"
            if git cat-file -e "${MERGE_BASE}:${path}" 2>/dev/null; then
              git checkout "${MERGE_BASE}" -- "$path"
              git restore --staged "$path"
            fi
          done

      # The Bash sandbox below needs these on Linux, plus the unprivileged user
      # namespaces Ubuntu 24.04 restricts. claude-code-action makes the same
      # setup only when `allowed_non_write_users` is set, which this workflow
      # never sets, and without it failIfUnavailable fails every review.
      - name: Install the Bash sandbox
        if: steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            [ "$attempt" = 3 ] && exit 1
            sleep 5
          done
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Managed settings are the one rule source no repo file can widen: with
      # allowManagedPermissionRulesOnly, the grants written for local use (the
      # skill's allowed-tools, .claude/settings.json) stop counting. `allow`
      # lists the gh and git verbs the protocol runs; Read, Glob, Grep and Agent
      # need no rule inside the checkout, and Claude Code's built-in read-only
      # commands (`ls`, `cat`, `head`, `grep`, `find`, `cd`, read-only `git`)
      # run in every mode; only an ask or deny rule narrows that set, as the
      # `--output` deny below does for git. Anything else is refused
      # and lands in the record's permission_denials, so a verb the skill starts
      # using must be added here: dontAsk, the mode set here, denies whatever
      # would prompt, and a run in any other mode has nobody to answer the
      # prompt. Auto mode, whose classifier approves commands no rule names, is
      # off. None of the verbs writes: the poster job is the review's only
      # writer, so a PR whose diff tells the reviewer to post something has no
      # channel to do it through.
      # `gh api` stays out because no deny pattern can hold it read-only: gh
      # bundles short flags (`-if body=x` is a POST). `git fetch` and `git
      # checkout` stay out because the only checkout the model could want
      # reverts the config restore. `git diff *` keeps its space so it cannot
      # match `git difftool`, which runs a command, and `git grep` stays out
      # because `-O` runs one (the Grep tool covers it). `deny` holds the file
      # tools in every mode, since a --permission-mode flag outranks the mode
      # set here (the `prompt` input runs the action's agent mode, which passes
      # none, but its tag mode passes acceptEdits), and strips
      # `--output`, which makes any git diff, log or show write a file of its
      # choosing, and refuses a `gh` read naming a repo: a fork's PR body can
      # close another repo's issue, which the job's token may read and the
      # review would quote. `-R`/`--repo` and a URL name one with a `/`, except
      # the scp form `git@github.com:owner%2Frepo`, whose `/` gh decodes itself,
      # so `@` is refused too; no protocol call passes either to gh. The sandbox
      # confines what an allowed call can still reach: writes only inside the
      # checkout and Claude Code's own temp directory (the runner's $GITHUB_ENV
      # and the review tooling are in neither) and no host but GitHub's API;
      # failIfUnavailable makes a sandbox that cannot start fail the run, never
      # run it unsandboxed.
      - name: Lock the review's permissions
        if: steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        run: |
          sudo mkdir -p /etc/claude-code
          sudo tee /etc/claude-code/managed-settings.json >/dev/null <<'EOF'
          {
            "allowManagedPermissionRulesOnly": true,
            "disableAutoMode": "disable",
            "permissions": {
              "defaultMode": "dontAsk",
              "disableBypassPermissionsMode": "disable",
              "allow": [
                "Skill",
                "StructuredOutput",
                "Bash(gh pr diff*)",
                "Bash(gh pr view*)",
                "Bash(gh issue view*)",
                "Bash(git diff *)",
                "Bash(git status*)",
                "Bash(git log*)",
                "Bash(git show*)",
                "Bash(git rev-parse*)",
                "Bash(git rev-list*)",
                "Bash(git merge-base*)"
              ],
              "deny": [
                "Edit",
                "Write",
                "NotebookEdit",
                "Bash(git *--output*)",
                "Bash(gh issue view*/*)",
                "Bash(gh pr view*/*)",
                "Bash(gh pr diff*/*)",
                "Bash(gh issue view*@*)",
                "Bash(gh pr view*@*)",
                "Bash(gh pr diff*@*)"
              ]
            },
            "sandbox": {
              "enabled": true,
              "failIfUnavailable": true,
              "allowUnsandboxedCommands": false,
              "autoAllowBashIfSandboxed": false,
              "network": {
                "allowedDomains": ["api.github.com"],
                "allowManagedDomainsOnly": true
              }
            }
          }
          EOF

      - name: Run Claude Code Review
        if: steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        id: claude-review
        # SHA-pinned (secrets + write token); the tag comment tracks the version.
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        # pr-ci-review spawns reviewers by the `opus` / `sonnet` aliases; these pin
        # the aliases to exact ids, so a Claude Code bump cannot move a tier
        # silently, while a local /pr-ci-review still follows the local defaults.
        env:
          ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-5-5
          ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5-5
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token, so the action skips its GitHub App token exchange. That exchange
          # refuses (401) unless this file is byte-identical to the copy on the default branch,
          # which would leave every PR that edits the workflow unreviewable by it. The review only
          # ever reads through this token: the poster below is what writes to the PR.
          github_token: ${{ github.token }}
          prompt: |
            /pr-ci-review

            Pull request: #${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }}
            ${{ steps.preflight.outputs.mode_line }}
            Merge base: ${{ steps.preflight.outputs.merge_base }}
            Depth: ${{ steps.preflight.outputs.depth }}
            Areas: ${{ steps.preflight.outputs.areas }}
          # Background tasks off: recent Claude Code runs a subagent in the
          # background unless the model asks otherwise, and the action keeps the
          # first `result` a run emits and stops reading. With reviewers still
          # out, that result is an empty record, which reads as a clean review
          # of a diff nobody reviewed. Off, every Agent call runs in the
          # foreground and returns its report, calls sent in one message still
          # run together, and the run emits a single result.
          # Through `settings`, the action's documented channel for custom env,
          # not the step `env:` above: the action's run step forwards only the
          # names its own `env:` lists. `settings` lands in user settings, whose
          # `env` Claude Code applies at startup.
          settings: |
            {"env": {"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"}}
          # Orchestrator model only: pr-ci-review sets each reviewer's model at
          # spawn time, through the aliases the env above pins. The orchestrator
          # runs Opus at its default effort because its spawn and triage
          # decisions decide what the review covers, raised to high when a
          # comment asks for a deep review; the correctness and security
          # reviewers and the validators ask for high in `.claude/agents/`.
          # Posted precision is still gated by the per-important opus validators.
          # The permission rules live in the managed settings locked above, which
          # make --allowedTools count for nothing as a rule; it stays because
          # naming Glob and Grep here is what puts them in the tool set on Linux.
          claude_args: |
            --model "claude-opus-5-5"
            ${{ steps.preflight.outputs.depth == 'deep' && '--effort high' || '' }}
            --allowedTools "Glob,Grep"
            --json-schema '${{ steps.gen-schema.outputs.schema }}'

      # The hand-off to the poster job, as files rather than job outputs: a findings
      # record can be large, and job outputs are size-capped and string-typed. On
      # `always()` because a run that died still owes the PR a verdict, and the poster
      # builds that verdict from what is (or is not) in here. Under the runner's temp,
      # never the checkout: the checkout is the PR head, where a fork can commit
      # review-output as a symlink the write would follow.
      - name: Save the review output
        if: always() && steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        env:
          REVIEW_STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
          REVIEW_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          mkdir -p "${RUNNER_TEMP}/review-output"
          printf '%s' "$REVIEW_STRUCTURED_OUTPUT" > "${RUNNER_TEMP}/review-output/structured-output.json"
          if [ -n "$REVIEW_EXECUTION_FILE" ] && [ -f "$REVIEW_EXECUTION_FILE" ]; then
            cp "$REVIEW_EXECUTION_FILE" "${RUNNER_TEMP}/review-output/execution.json"
          fi

      - name: Upload the review output
        if: always() && steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: review-output
          path: ${{ runner.temp }}/review-output/
          if-no-files-found: warn

  # The review's only writer, in its own job so the write permissions never sit in the same
  # environment as the model. On `always()` because a run that died still owes the PR a verdict:
  # a green check on an untouched PR is exactly what a clean review looks like. The job fails red
  # when it cannot post, so its silence is never mistaken for a clean bill.
  post-review:
    needs: claude-review
    if: always() && needs.claude-review.result != 'skipped' && needs.claude-review.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      # For the reaction on a `@claude review` comment, nothing else: a PR comment's reactions
      # live on the issues API.
      issues: write
      # For the claude-review commit status, nothing else.
      statuses: write
    steps:
      # Full history: anchoring a finding to a line means diffing the reviewed commit against the
      # merge base, and a shallow checkout cannot resolve it.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # --ignore-scripts: the install runs with this job's token in the environment.
      - name: Install review tooling
        run: npm install --global --ignore-scripts "agentspine@${AGENTSPINE_VERSION}"

      # The exact commit the review ran against, never whatever the head is now: a push landing
      # mid-review would otherwise shift every line number the findings point at. Absent (the
      # review died before the preflight) leaves the checkout where it is; the poster then has no
      # diff to anchor to and says so.
      - name: Check out the reviewed commit
        if: needs.claude-review.outputs.sha != ''
        env:
          REVIEW_COMMIT_SHA: ${{ needs.claude-review.outputs.sha }}
        run: git -c advice.detachedHead=false checkout "$REVIEW_COMMIT_SHA"

      # A run that died before uploading leaves no artifact, which is not this job's error: the
      # poster reads that absence as "not reviewed" and posts exactly that. Every hand-off file
      # in this job sits under the runner's temp, never the checkout, which is the PR head: a
      # fork could commit posted.json as a symlink the write would follow, or a review-output/
      # the poster would read as the verdict whenever the download finds none.
      - name: Download the review output
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: review-output
          path: ${{ runner.temp }}/review-output

      - name: Post review
        id: post
        env:
          REVIEW_STRUCTURED_OUTPUT_FILE: ${{ runner.temp }}/review-output/structured-output.json
          REVIEW_STEP_OUTCOME: ${{ needs.claude-review.outputs.outcome }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_COMMIT_SHA: ${{ needs.claude-review.outputs.sha }}
          REVIEW_MERGE_BASE: ${{ needs.claude-review.outputs.merge_base }}
          REVIEW_PARTIAL: ${{ needs.claude-review.outputs.partial }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_POSTED_OUTPUT: ${{ runner.temp }}/posted.json
        # Handed over both ways: the file is what a findings record needs, and the inline copy
        # keeps an older pinned agentspine working, which would otherwise read no output at all
        # and report a finished review as "not reviewed".
        run: |
          REVIEW_STRUCTURED_OUTPUT="$(cat "$REVIEW_STRUCTURED_OUTPUT_FILE" 2>/dev/null || true)" \
            agentspine review post

      # The poster picks the reaction; a run it never finished (a failed preflight, a
      # cancellation) gets confused. A comment on a PR that closed before the review started gets
      # none: this job is skipped along with the review, whose token cannot react. When the
      # Claude GitHub app is installed it adds its own 👀 to any @claude mention, so this is the
      # workflow's only reaction. It goes on before the cleanup, so a failed delete never costs
      # it, and then every other reaction this workflow left goes: a re-run's earlier verdict.
      # Best-effort: a reaction is feedback, never a reason to fail the review.
      - name: React with the verdict
        if: always() && github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REACTIONS: repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions
          REACTION: ${{ steps.post.outputs.reaction }}
        run: |
          id=$(gh api --method POST "$REACTIONS" -f content="${REACTION:-confused}" --jq .id)
          for old in $(gh api --paginate "$REACTIONS" --jq ".[] | select(.user.login == \"github-actions[bot]\" and .id != $id) | .id"); do
            gh api --method DELETE "$REACTIONS/$old"
          done

      - name: Emit review metrics
        if: always()
        env:
          REVIEW_EXECUTION_FILE: ${{ runner.temp }}/review-output/execution.json
          REVIEW_STRUCTURED_OUTPUT_FILE: ${{ runner.temp }}/review-output/structured-output.json
          REVIEW_STEP_OUTCOME: ${{ needs.claude-review.outputs.outcome }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_COMMIT_SHA: ${{ needs.claude-review.outputs.sha }}
          REVIEW_POSTED_INPUT: ${{ runner.temp }}/posted.json
          REVIEW_COMMENT: ${{ github.event.comment.body }}
          REVIEW_METRICS_OUTPUT: ${{ runner.temp }}/review-metrics.json
        run: |
          REVIEW_STRUCTURED_OUTPUT="$(cat "$REVIEW_STRUCTURED_OUTPUT_FILE" 2>/dev/null || true)" \
            agentspine review metrics

      - name: Upload review metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-metrics
          path: ${{ runner.temp }}/review-metrics.json
          if-no-files-found: warn

  # Artifacts expire after 90 days, which would erase the retro's history; the
  # ci/review-metrics orphan branch is the durable sink (one records/<run_id>.json
  # per run). A separate job so `contents: write` never reaches the model-driven
  # review steps above. `always()` because an errored run's record is the retro's
  # outage signal.
  persist-metrics:
    needs: [claude-review, post-review]
    # `result != 'skipped'` matters: issue_comment fires on every PR comment, and
    # without it `always()` would spin this job up for each one claude-review skips.
    if: always() && needs.claude-review.result != 'skipped' && needs.claude-review.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A cancelled or early-failed review leaves no artifact; that is not this
      # job's error, so tolerate absence and let the guard below no-op.
      - name: Download review metrics
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: review-metrics
          path: ${{ runner.temp }}/review-metrics

      # The contents API, not a checkout + git push: API commits made with the
      # workflow token are signed by GitHub's web-flow key, which a
      # verified-signatures ruleset requires (it rejects the runner's unsigned
      # git commits). A missing branch 404s the PUT, so a deleted
      # ci/review-metrics fails loudly here instead of being silently recreated
      # without its history.
      - name: Append record to ci/review-metrics
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ runner.temp }}/review-metrics/review-metrics.json
          RUN_ID: ${{ github.run_id }}
        run: |
          path="records/${RUN_ID}.json"
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ci/review-metrics" --jq .sha >/dev/null 2>&1; then
            echo "record for run ${RUN_ID} already persisted"
            exit 0
          fi
          # Reviews on different PRs can finish together; concurrent appends of
          # distinct records 409 and resolve on retry.
          for attempt in 1 2 3 4 5; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="review-metrics: run ${RUN_ID}" \
              -f branch="ci/review-metrics" \
              -f content="$(base64 -w0 < "$SRC")" >/dev/null; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::failed to persist review-metrics record after 5 attempts"
          exit 1
